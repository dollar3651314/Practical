# Practical 1.0 自用版（agents 项目/Practical）：Cloudflare Worker + R2，零成本（P-5 已定）。
# - 先用 workers.dev 免费子域名（C93）；品牌和自有域名留到阶段 C，所以这里不写 routes。
# - 密钥一个都不写在这里（底线 1）：部署用的 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID 由 Amos 填进 GitHub 仓库 Secrets，见《上线操作手册》。
# - 没有数据库：成绩只存浏览器 localStorage（《使用场景清单-自用版》第一节，阶段 B 不做账号、不做跨设备同步）。
# - 没有定时任务（全账号只有 5 个，C120）。
name = "practical"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

# 网页本体（web/ 整个目录）由 Cloudflare 直接发，Worker 只管 /api/* 和 /media/*
[assets]
directory = "web"
binding = "ASSETS"

# 真素材（30 个场景 × 4 图 + 1 段音频）。桶由 Amos 在控制台建一次，见《上线操作手册》第二步。
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "practical-media"

[vars]
ENVIRONMENT = "production"

[env.staging]
name = "practical-staging"
workers_dev = true

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "practical-media-staging"

[env.staging.assets]
directory = "web"
binding = "ASSETS"

[env.staging.vars]
ENVIRONMENT = "staging"
